[project]
authors = [{name = "fauchereaun", email = "nicolas.fauchereau@niwa.co.nz"}]
dependencies = ["datawrapper>=2.1.0,<3"]
name = "ENSO_tracker"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
enso_tracker = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
xarray = ">=2026.7.0,<2027"
pandas = ">=3.0.5,<4"
matplotlib = ">=3.11.1,<4"
seaborn = ">=0.13.2,<0.14"
openpyxl = ">=3.1.5,<4"
jupyterlab = ">=4.6.3,<5"
python-dotenv = ">=1.2.3,<2"
